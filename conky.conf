-- ============================================================
--  Conky config — Arch Linux / KDE Plasma
--  Color scheme: green (#12c812), mint (#54ffc0)
-- ============================================================

conky.config = {
    -- === Window / KDE Plasma integration ===
    alignment           = 'top_right',
    xinerama_head       = 1,            -- 0=monitor 1, 1=monitor 2, 2=monitor 3... (see notes below)
    gap_x               = 10,
    gap_y               = 0,
    minimum_width       = 492,
    maximum_width       = 492,
    minimum_height      = 1440,

    own_window          = true,
    own_window_type     = 'dock',              -- plays nicely with Plasma/KWin
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value  = 130,
    own_window_hints    = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class    = 'conky',

    double_buffer       = true,
    update_interval     = 1.5,
    net_avg_samples     = 2,
    cpu_avg_samples     = 2,
    no_buffers          = true,

    -- === Fonts / text ===
    use_xft             = true,
    font                = 'JetBrains Mono:size=10',
    xftalpha             = 0.9,
    override_utf8_locale = true,
    uppercase            = false,
    draw_shades          = true,
    default_shade_color  = '000000',

    -- === Colors (green / mint / gold) ===
    default_color        = 'C8C8C8',
    color1                = '12C812',   -- primary green   (headers, bars)
    color2                = '54FFC0',   -- mint            (values, highlights)
    color3                = 'FFFFFF',   -- white accent     (warnings/top items)

    draw_borders          = true,
    draw_graph_borders     = true,
    border_width           = 1,
    border_inner_margin    = 10,
    border_outer_margin    = 0,
    stippled_borders       = 0,

    -- === Misc ===
    background            = true,
    total_run_times       = 0,
    use_spacer             = 'none',
    imlib_cache_size       = 0,
};

-- ============================================================
--  TEXT SECTION
-- ============================================================
conky.text = [[
${font JetBrains Mono:bold:size=13}${color1}SYSTEM${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}Host:${color} ${nodename}   ${color1}Kernel:${color} ${kernel}
${color1}Arch:${color} ${machine}   ${color1}Uptime:${color} ${color2}${uptime}${color}
${color1}Load:${color2} ${loadavg}${color}
${font}

${font JetBrains Mono:bold:size=13}${color1}CPU${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}Model:${color} ${exec lscpu | grep 'Model name' | sed -e 's/Model name:\s*//' | cut -c1-38}
${color1}Freq:${color2} ${freq_g} GHz${color}    ${color1}Temp:${color2} ${hwmon 0 temp 1}°C${color}
${color1}Total Usage:${color} ${cpu cpu0}%  ${color2}${cpubar cpu0 12,180}${color}
${font}
${cpugraph cpu0 50,400 12c812 54ffc0 -t}
${font JetBrains Mono:size=9}\
${color1}core1${color} ${color2}${cpu cpu1}%${color}${goto 100}${color2}${cpubar cpu1 10,70}${color}${goto 210}${color1}core2${color} ${color2}${cpu cpu2}%${color}${goto 290}${color2}${cpubar cpu2 10,70}${color}
${color1}core3${color} ${color2}${cpu cpu3}%${color}${goto 100}${color2}${cpubar cpu3 10,70}${color}${goto 210}${color1}core4${color} ${color2}${cpu cpu4}%${color}${goto 290}${color2}${cpubar cpu4 10,70}${color}
${color1}core5${color} ${color2}${cpu cpu5}%${color}${goto 100}${color2}${cpubar cpu5 10,70}${color}${goto 210}${color1}core6${color} ${color2}${cpu cpu6}%${color}${goto 290}${color2}${cpubar cpu6 10,70}${color}
${color1}core7${color} ${color2}${cpu cpu7}%${color}${goto 100}${color2}${cpubar cpu7 10,70}${color}${goto 210}${color1}core8${color} ${color2}${cpu cpu8}%${color}${goto 290}${color2}${cpubar cpu8 10,70}${color}
${font}

${font JetBrains Mono:bold:size=13}${color1}MEMORY${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}RAM:${color} ${color2}$mem${color} / $memmax   ${color3}($memperc%)${color}
${color2}${membar 12,400}${color}
${color1}Swap:${color} ${color2}$swap${color} / $swapmax   ${color3}($swapperc%)${color}
${color2}${swapbar 10,400}${color}
${font}
${memgraph 40,400 12c812 54ffc0 -t}

${font JetBrains Mono:bold:size=13}${color1}DISK${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}/ (root)${color}  ${color2}${fs_used /}${color} / ${fs_size /}   ${color3}(${fs_used_perc /}%)${color}
${color2}${fs_bar 10,400 /}${color}
${if_existing /home}${color1}/home${color}      ${color2}${fs_used /home}${color} / ${fs_size /home}   ${color3}(${fs_used_perc /home}%)${color}
${color2}${fs_bar 10,400 /home}${color}
${endif}
${color1}Read:${color} ${color2}${diskio_read}${color}  ${color1}Write:${color} ${color2}${diskio_write}${color}
${diskiograph 35,400 12c812 54ffc0 -t}
${font}

${font JetBrains Mono:bold:size=13}${color1}NETWORK${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}Interface:${color} ${color2}${wireless_essid wlan0}${color}  ${if_up wlan0}${color3}${wireless_link_qual_perc wlan0}%${color}${endif}
${color1}IP:${color} ${color2}${addr wlan0}${color}
${color1}Down:${color} ${color2}${downspeed wlan0}${color}/s  ${color1}Total:${color} ${totaldown wlan0}
${downspeedgraph wlan0 35,400 12c812 54ffc0 -t}
${color1}Up:${color}   ${color2}${upspeed wlan0}${color}/s  ${color1}Total:${color} ${totalup wlan0}
${upspeedgraph wlan0 35,400 12c812 54ffc0 -t}
${font}

${font JetBrains Mono:bold:size=13}${color1}TOP PROCESSES (CPU)${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}\
${color3}${top name 1}${color} ${alignr}${color2}${top cpu 1}%${color}
${color1}${top name 2}${color} ${alignr}${color2}${top cpu 2}%${color}
${color1}${top name 3}${color} ${alignr}${color2}${top cpu 3}%${color}
${color1}${top name 4}${color} ${alignr}${color2}${top cpu 4}%${color}
${color1}${top name 5}${color} ${alignr}${color2}${top cpu 5}%${color}
${font}

${font JetBrains Mono:bold:size=13}${color1}TOP PROCESSES (MEM)${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}\
${color3}${top_mem name 1}${color} ${alignr}${color2}${top_mem mem 1}%${color}
${color1}${top_mem name 2}${color} ${alignr}${color2}${top_mem mem 2}%${color}
${color1}${top_mem name 3}${color} ${alignr}${color2}${top_mem mem 3}%${color}
${color1}${top_mem name 4}${color} ${alignr}${color2}${top_mem mem 4}%${color}
${color1}${top_mem name 5}${color} ${alignr}${color2}${top_mem mem 5}%${color}
${font}

${font JetBrains Mono:bold:size=13}${color1}PROCESSES${color}${font}${color1}${hr 2}${color}
${font JetBrains Mono:size=9}${color1}Running:${color} ${color2}$running_processes${color} / $processes total
${font}
]];
